<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        button{
            color: white;
            background-color: rgb(75, 192, 250);
            border-radius: 12px;
            border:none;
            padding: 5px 15px;
            margin: 0px;
            vertical-align: middle;
        }
        
        img{
            width: 60px;
            height: 60px;
            border-radius: 30px;
            vertical-align: middle;
            object-fit: cover;
            /* object-position: center; */
            margin-right: 5px;
        }
        
        .p1{
            font-size: 18px;
            vertical-align: middle;
            font-family: Arial;
            opacity: 0.7;
            border: none;
            font-size: 16px;
        }

    </Style>
</head>
<body>
    <img src="thunderstorm-illustration-digital-art-style.jpg" alt="">
    <input class='p1' placeholder="What's happening?">
    <button>Tweet</button>

</body>
</html>

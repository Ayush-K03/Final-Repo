    <p>Orders under $40=+$10 shipping</p>

    <input type="text" placeholder="Cost of order" style="border-width: 1px;" class="take">
    <button style="; margin: 0 10px;" onclick="calc();">Calculate</button>

        function calc(){
            let cost = Number(document.querySelector('.take').value);
            if (cost<=40){
                cost=cost+10;
            }

            document.querySelector('.text').innerHTML=`${cost}`;
        }

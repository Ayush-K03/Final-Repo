<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Youtube Subscribe Button.</p>
    <button class='sb' onclick="a23();">Subscribe</button>






    <script>
        function a23(){
            const a11= document.querySelector('.sb');
            if(a11.innerHTML==='Subscribe'){
                a11.innerHTML='Subscribed';
            }
        
            else{
                a11.innerHTML='Subscribe';
            }
        }

    </script>
</body>
</html>
